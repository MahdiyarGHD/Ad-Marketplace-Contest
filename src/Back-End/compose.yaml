services:
  admarketplace:
    image: admarketplace
    ports:
      - "80:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - TelegramBot__Token=${TELEGRAM_TOKEN}
      - TelegramBot__BotApiServer=https://api.telegram.org
      - TelegramBot__WebhookUrl=${WEBHOOK_URL}
      - ConnectionStrings__Main=Host=postgres;Port=5432;Database=AdMarketplace;Username=postgres;Password=postgres;Include Error Detail=true;
    depends_on:
      postgres:
        condition: service_healthy
      # telegram-bot-api:
      #   condition: service_started
    build:
      context: .
      dockerfile: AdMarketplace.WebApi/Dockerfile

  # telegram-bot-api:
  #   image: aiogram/telegram-bot-api:latest
  #   ports:
  #     - "8081:8081"
  #     - "8082:8082" 
  #   environment:
  #     - TELEGRAM_API_ID=
  #     - TELEGRAM_API_HASH=
  #     - TELEGRAM_STAT=1
  #     - TELEGRAM_LOCAL=1
  #   volumes:
  #     - telegram_bot_api_data:/var/lib/telegram-bot-api
  #   restart: unless-stopped

  postgres:
    image: hub.hamdocker.ir/postgres:16-alpine
    ports:
      - "127.0.0.1:5432:5432"
    environment:
      - POSTGRES_DB=AdMarketplace
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
  telegram_bot_api_data:
