on:
  pull_request:
    branches:
      - main
    types:
      - closed

jobs:
  deploy:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest

    permissions:
      contents: read
      pages: write
      id-token: write

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Create .env
      run: |
        cd src/Front-End
        touch .env
        echo "VITE_BACKEND_BASE_URL=${{secrets.BACKEND_BASE_URL}}" >> .env
        echo "VITE_BOT_USERNAME=${{secrets.VITE_BOT_USERNAME}}" >> .env
        
    - id: build-publish
      uses: bitovi/github-actions-react-to-github-pages@v1.2.4
      with:
        directory: src/Front-End
        path: src/Front-End/build
