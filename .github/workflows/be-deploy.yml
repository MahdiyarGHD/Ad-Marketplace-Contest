name: Deploy to Server

on:
  push:
    tags:
      - 'v*release*'

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          password: ${{ secrets.SSH_PASSWORD }}
          script: |
            APP_DIR="/var/www/admarketplace"
            REPO_URL="https://${{ secrets.GH_PAT }}@github.com/${{ github.repository }}.git"

            if [ -d "$APP_DIR" ]; then
              echo "Directory exists. Updating..."
              cd "$APP_DIR"
              
              git remote set-url origin "$REPO_URL"
              
              git fetch --all --tags
            else
              echo "Cloning fresh repository..."
              git clone "$REPO_URL" "$APP_DIR"
              cd "$APP_DIR"
            fi

            git checkout ${{ github.ref_name }}
            
            cd src/Back-End || echo "Warning: Could not change directory to src/Back-End"
            
            printf "TELEGRAM_TOKEN=${{ secrets.TELEGRAM_TOKEN }}\nBOT_SECRET_TOKEN=${{ secrets.BOT_SECRET_TOKEN }}\nTELEGRAM_API_ID=${{ secrets.TELEGRAM_API_ID }}\nTELEGRAM_API_HASH=${{ secrets.TELEGRAM_API_HASH }}\nWEBHOOK_URL=${{ secrets.WEBHOOK_URL }}\nBOT_USERNAME=${{ secrets.BOT_USERNAME }}\nAPP_SHORTNAME=${{ secrets.APP_SHORTNAME }}\n" > .env
            echo "Starting Docker Compose..."
            docker compose down --remove-orphans
            docker compose up -d --build
            
            docker image prune -f
            echo "Deployment of ${{ github.ref_name }} successful!"
